<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title data-i18n="meta.pickupTitle">输入取件码 — Relay</title>
    <link rel="stylesheet" href="/styles.css?v=13">
    <script src="/i18n.js?v=11" defer></script>
    <script src="/pickup-crypto.js" defer></script>
    <script src="/pickup.js?v=3" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="Relay 首页" data-i18n-aria="common.homeAria" data-language-link>
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7h11m0 0-3-3m3 3-3 3M18 17H7m0 0 3 3m-3-3 3-3"/></svg></span>
        <span>Relay</span>
      </a>
      <div class="header-actions">
        <nav class="transfer-nav" aria-label="传输方式" data-i18n-aria="nav.transferAria">
          <a class="transfer-nav-link active" href="/pickup" aria-current="page" data-i18n="nav.pickup" data-language-link>提取文件</a>
          <a class="transfer-nav-link" href="/" data-i18n="nav.send" data-language-link>发送文件</a>
        </nav>
        <button id="language-toggle" class="language-toggle" type="button">English</button>
        <div class="privacy-pill"><span></span> <span data-i18n="common.security">端到端加密 · 不存文件</span></div>
      </div>
    </header>

    <main class="pickup-main">
      <section class="pickup-card">
        <div class="pickup-orbit" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19.5h14"/></svg></div>
        <p class="eyebrow" data-i18n="pickup.eyebrow">Relay 取件</p>
        <h1 data-i18n-html="pickup.title">输入取件码</h1>
        <p class="pickup-message" data-i18n="pickup.message">名字 + 6 位数字。双方需同时在线。</p>
        <form id="pickup-form" class="pickup-form">
          <label for="pickup-input" data-i18n="pickup.label">取件码</label>
          <input id="pickup-input" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="13" placeholder="例如 EMMA-482731" data-i18n-placeholder="pickup.placeholder" aria-describedby="pickup-help pickup-error" autofocus>
          <small id="pickup-help" data-i18n="pickup.help">4–6 位英文字母 + 6 位数字，不区分大小写</small>
          <button id="pickup-submit" class="primary-button" type="submit"><span data-i18n="pickup.submit">提取文件</span><span aria-hidden="true">→</span></button>
          <p id="pickup-error" class="error-message" role="alert"></p>
        </form>
        <a class="pickup-back" href="/" data-i18n="pickup.back" data-language-link>我要发送文件</a>
      </section>
    </main>

    <footer><span data-i18n="common.footerSecurity">AES-GCM 加密 · SHA-256 完整性校验</span><span data-i18n="pickup.footer">取件码在未确认时最长 24 小时后自动失效</span></footer>
  </body>
</html>
